name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work/fox-unified-studio

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: fox
          POSTGRES_PASSWORD: fox
          POSTGRES_DB: fox_test
        options: >-
          --health-cmd "pg_isready -U fox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15
      DATABASE_URL: postgresql://fox:fox@127.0.0.1:5432/fox_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: uv run --no-sync ruff check app cli.py main.py webui test docs/skill

      - name: Apply security migrations
        run: |
          set -e
          for f in migrations/001_task_ownership.sql migrations/002_rate_limit_counters.sql migrations/003_rls_policies.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run unit tests with coverage
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      - name: Install FFmpeg for native revision-rendering tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run native revision-rendering tests
        run: >-
          uv run --no-sync python -X utf8 -m coverage run --append -m pytest -q
          test/services/test_video_project.py test/services/test_minimax_output_container.py

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py
          test/services/test_cache_manager.py
          test/services/test_material_cache.py
          test/services/test_subtitle_arabic_shaping.py
