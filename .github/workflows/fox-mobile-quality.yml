name: FOX Mobile Quality Gate

on:
  push:
    branches:
      - work/fox-unified-studio
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/fox-mobile-quality.yml"

permissions:
  contents: read

concurrency:
  group: fox-mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Web export
        run: npm run export:web

      - name: Verify static export
        run: test -f dist/index.html
