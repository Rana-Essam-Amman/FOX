name: FOX Mobile Quality Gate

on:
  push:
    branches:
      - work/fox-unified-studio
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/fox-mobile-quality.yml"

permissions:
  contents: read

concurrency:
  group: fox-mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Expo SDK compatibility
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const report = require('./npm-audit.json'); console.log('AUDIT_SUMMARY', JSON.stringify(report.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) console.log('AUDIT_ITEM', JSON.stringify({ name, severity: item.severity, range: item.range, fixAvailable: item.fixAvailable, via: item.via.map(entry => typeof entry === 'string' ? entry : entry.title) }));"

      - name: Rule 14 line-count guard
        run: node scripts/rule14-check.js

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Web export
        run: npm run export:web

      - name: Verify static export
        run: test -f dist/index.html
